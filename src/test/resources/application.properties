query.for.jobresult= select count(*) from table_type_values where "column" ='doHandleIncomingMessageFromFileJobLogic' and tablename ='activeJobLogicUtilDoMethod'
query.for.testing =SELECT i.contractid AS "Toewijzingsnr", i.productstartdate AS "StartPeriode", i.productenddate AS "EindPeriode", p.vektisproductcode AS "ProductCode", p.name AS "ProductNaam", i.declaredinvoiceamount AS "Tarief(excl)", i.deliverednumberofunits AS "#Eenheden", ir.id AS "Rejectreason Id", ir.name AS "Rejectreason Name", ir.ggkretourcode AS "Rejectreason ggkretourcode", i.rejectreasonremark AS "Invoiceline rejectreasonremark" FROM invoiceline i JOIN product p ON p.id = i.productid JOIN invoicestatus s ON s.id = i.status LEFT JOIN invoiceline_rejectreason ir ON ir.id = i.invoiceline_rejectreasonid WHERE i.invoicelinedate IS NOT NULL AND i.facilitatorid = 24 AND i.supplierid = 1475 AND i.contractid = 22378 AND i.status IN (8500, 8400) AND DATE(i.invoicelinedate) = '2025-07-02' ORDER BY i.invoicelinedate DESC , i.deliverednumberofunits asc LIMIT 2;
